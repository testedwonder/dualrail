# GitHub uses this conventional filename for its Pages workflow. Dualrail Atlas
# is a Vite application, so this workflow publishes app/dist without Jekyll.
name: Build and deploy Dualrail Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install application dependencies
        run: npm ci --prefix app

      - name: Audit application dependencies
        run: npm audit --prefix app --audit-level=low

      - name: Run Python regression suite
        run: python -B -m unittest discover -s tests -v

      - name: Check generated complexity
        run: python -B tools/update_complexity.py --check

      - name: Validate knowledge tree
        run: python -B tools/validate_knowledge.py

      - name: Test application
        run: npm --prefix app test

      - name: Build path-safe PWA
        env:
          VITE_BASE_PATH: /dualrail/
        run: npm --prefix app run build

      - name: Check whitespace
        run: git diff --check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
